name: Bug report
description: Something does not work as documented
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        The Sweetspot Tools projects are a work in progress. Please search the open issues first.
        Security problems do not belong here: read the [security policy](https://github.com/sweetspot-tools/.github/blob/main/SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Where did it happen?
      options:
        - Fairy Tapes · The Stripper
        - Fairy Tapes · Pillow Talk
        - Fairy Tapes · Hotline
        - Fairy Tapes · Deep Throat
        - Fairy Tapes · Happy Ending
        - Fairy Tapes · other
        - Swingers
        - Turn Me On
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.2.3 or a commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host (DAW, browser or standalone) and its version, plug-in format (VST3, AU, CLAP), and the operating system.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
