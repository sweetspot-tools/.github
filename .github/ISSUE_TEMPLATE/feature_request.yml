name: Feature request
description: Propose an improvement or a new capability
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Each plug-in follows a written design: describing the problem first helps us agree on it
        before any code is written. Please search the open issues first.
  - type: dropdown
    id: component
    attributes:
      label: Which part?
      options:
        - Fairy Tapes · The Stripper
        - Fairy Tapes · Pillow Talk
        - Fairy Tapes · Hotline
        - Fairy Tapes · Deep Throat
        - Fairy Tapes · Happy Ending
        - Fairy Tapes · other
        - Swingers
        - Turn Me On
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you contribute it?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
